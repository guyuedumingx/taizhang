[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# 策略侧支持通配符: p 规则里的 obj/act 为 "*" 时匹配任意请求 (请求侧仍精确匹配)
# 背景: 此前为纯等值比较, `p, admin, *, *` 之类的通配策略永远无法命中
m = g(r.sub, p.sub) && (r.obj == p.obj || p.obj == "*") && (r.act == p.act || p.act == "*")